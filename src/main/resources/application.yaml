spring:
  application:
    name: inmobiliaria
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

server:
  # Trusts X-Forwarded-For only from internal proxy IPs (Tomcat RemoteIpValve defaults); needed for per-IP rate limiting
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:native}

cors:
  # Comma-separated exact origins
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://wasiq-project-front.vercel.app}

jwt:
  secret: ${JWT_SECRET}
  # 15 minutes, aligned with the access-token cookie max age
  expiration: ${JWT_EXPIRATION_TIME:900000}
  refresh-token:
    expiration: ${JWT_REFRESH_EXPIRATION:2592000000}

cloudinary:
  cloud_name: ${CLOUD_NAME}
  cloud_api_key: ${CLOUD_API_KEY}
  cloud_api_secret: ${CLOUD_API_SECRET}

admin:
  email: ${ADMIN_EMAIL}