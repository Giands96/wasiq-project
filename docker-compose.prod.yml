services:
  wasiq-api:
    build: .
    container_name: wasiq-api
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      JAVA_TOOL_OPTIONS: >-
        -XX:MaxRAMPercentage=70
        -XX:InitialRAMPercentage=20
        -XX:+UseG1GC
        -XX:+ExitOnOutOfMemoryError
    ports:
      - "8080:8080"